<!DOCTYPE html>
<html lang="zh-Hant"><head><base target="_blank"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;padding:22px;font:15px/1.6 Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#17384a;background:#f7fafb}h1{font-size:23px;margin:0 0 8px}p{margin:0 0 14px;color:#526671}label{display:block;font-weight:700;margin:12px 0 5px}input,select,button{font:inherit}input[type=text],select{width:100%;padding:9px 12px;border:1px solid #b7cbd2;border-radius:8px;background:#fff}input[type=file]{width:100%;padding:10px 0}button{padding:11px 18px;border:0;border-radius:9px;cursor:pointer;background:#17384a;color:#fff}button:disabled{opacity:.45;cursor:wait}.secondary{background:white;color:#17384a;border:1px solid #b7cbd2}.preview{background:#fff;border:1px solid #d9e4e8;border-radius:12px;padding:12px;margin:14px 0;text-align:center}.preview img{display:block;max-width:100%;max-height:230px;object-fit:contain;margin:auto}.preview[hidden],img[hidden]{display:none}.status{min-height:24px;margin:10px 0;font-weight:700}.bad{color:#a52825}.row{display:flex;gap:10px;flex-wrap:wrap}hr{border:0;border-top:1px solid #d9e4e8;margin:22px 0}small{color:#526671}a{color:#175e83}
</style></head><body>
<h1>老師更換地圖</h1><p>上傳並套用後，全班新開啟或重新開始拼圖時會使用新地圖。固定 24 片，成績依地圖版本分開統計。</p>
<p id="current">正在讀取目前地圖…</p>
<label for="imageFile">1. 選擇地圖圖片（JPG／PNG）</label><input id="imageFile" type="file" accept="image/jpeg,image/png">
<label for="mapName">2. 地圖名稱</label><input id="mapName" type="text" maxlength="24" placeholder="例如：臺灣縣市、中國地形、世界氣候">
<div id="previewBox" class="preview" hidden><img id="preview" alt="新地圖預覽"><small id="imageInfo"></small></div>
<div class="row"><button id="publish" disabled>套用給全班</button><a href="https://traihonhwetw.github.io/ltjh-geography/games/taiwan-landform-jigsaw.html">開啟學生拼圖頁</a></div>
<div id="status" class="status" role="status"></div><small>已經開始的挑戰會繼續使用當次地圖。新圖片會公開給學生觀看，請選擇適合全班使用的教材。</small>
<hr><label for="history">切換回已用過的地圖</label><select id="history" disabled><option>讀取中…</option></select>
<button id="restore" class="secondary" style="margin-top:10px" disabled>套用選取地圖</button>
<script>
const $=s=>document.querySelector(s);let preparedImage='',busy=false,currentId='',stateLoaded=false;
function message(text,bad=false){$('#status').textContent=text;$('#status').className='status'+(bad?' bad':'')}
function controls(){const ready=!busy;$('#publish').disabled=!ready||!preparedImage||!$('#mapName').value.trim();$('#restore').disabled=!ready||!stateLoaded||!$('#history').value||$('#history').value===currentId;$('#imageFile').disabled=!ready;$('#mapName').disabled=!ready;$('#history').disabled=!ready||!stateLoaded}
function failure(err){busy=false;message(err&&err.message?err.message:String(err),true);controls()}
function refresh(done){google.script.run.withSuccessHandler(state=>{currentId=state.current.id;stateLoaded=true;$('#current').textContent='目前全班地圖：'+state.current.name;$('#history').replaceChildren();state.history.forEach(m=>{const o=document.createElement('option');o.value=m.id;o.textContent=m.name+(m.updatedAt?'（'+new Date(m.updatedAt).toLocaleString('zh-TW')+'）':'（原始地圖）');$('#history').appendChild(o)});$('#history').value=currentId;busy=false;controls();if(done)done()}).withFailureHandler(failure).getJigsawMapManagerState()}
function readFile(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('圖片讀取失敗'));r.readAsDataURL(file)})}
function decode(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('圖片無法開啟，請選擇 JPG／PNG'));im.src=src})}
async function prepare(file){if(!file) return;preparedImage='';busy=true;controls();message('正在處理圖片…');try{if(file.size>20*1024*1024)throw new Error('請選擇小於 20 MB 的圖片');if(!/\.(jpe?g|png)$/i.test(file.name)&&!/^image\/(jpeg|png)$/.test(file.type))throw new Error('請選擇 JPG／PNG 圖片');const im=await decode(await readFile(file));if(im.naturalWidth<200||im.naturalHeight<200)throw new Error('圖片太小，請選擇長寬至少 200 像素的地圖');let scale=Math.min(1,2200/Math.max(im.naturalWidth,im.naturalHeight)),data='',cw=0,ch=0;for(let attempt=0;attempt<8;attempt++){const c=document.createElement('canvas');cw=c.width=Math.round(im.naturalWidth*scale);ch=c.height=Math.round(im.naturalHeight*scale);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cw,ch);x.drawImage(im,0,0,cw,ch);data=c.toDataURL('image/jpeg',attempt<3?.92-attempt*.1:.7);if(data.length<=1150000)break;scale*=.82}if(data.length>1150000)throw new Error('圖片仍然過大，請先裁掉多餘的空白');preparedImage=data;$('#preview').src=data;$('#previewBox').hidden=false;$('#imageInfo').textContent=cw+' × '+ch+' 像素，約 '+Math.round(data.length*.75/1024)+' KB';$('#mapName').value=file.name.replace(/\.[^.]+$/,'').slice(0,24);busy=false;message('請確認預覽和名稱，再按「套用給全班」。');controls()}catch(e){failure(e)}}
$('#imageFile').addEventListener('change',e=>prepare(e.target.files[0]));$('#mapName').addEventListener('input',controls);$('#history').addEventListener('change',controls);
$('#publish').addEventListener('click',()=>{if(busy||!preparedImage)return;busy=true;controls();message('正在儲存並套用，請勿關閉視窗…');google.script.run.withSuccessHandler(result=>{preparedImage='';$('#imageFile').value='';refresh(()=>message('已套用「'+result.name+'」。學生重新開啟或重新開始即可看到新地圖。'))}).withFailureHandler(failure).saveJigsawMap({name:$('#mapName').value,image:preparedImage})});
$('#restore').addEventListener('click',()=>{if(busy)return;busy=true;controls();message('正在切換全班地圖…');google.script.run.withSuccessHandler(result=>refresh(()=>message('已切換為「'+result.name+'」。'))).withFailureHandler(failure).activateJigsawMap($('#history').value)});
refresh();
</script></body></html>
